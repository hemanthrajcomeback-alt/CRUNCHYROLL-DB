services:
  - name: crunchroll-downloader-bot
    type: worker          # MUST be worker for Telegram polling bots
    runtime: docker       # Use your Dockerfile
    plan: starter         # Or "basic". Free tier does NOT support workers.
    autoDeploy: true

    envVars:
      - key: TELEGRAM_TOKEN
        sync: false       # Secret, added manually in Render dashboard
      - key: CRUNCHYROLL_COOKIES_FILE
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false

    # ONLY IF YOU WANT TO OVERRIDE CMD IN DOCKERFILE
    # else remove this block and keep Dockerfile CMD
    dockerCommand: "python main.py"

    maxShutdownDelaySeconds: 30
